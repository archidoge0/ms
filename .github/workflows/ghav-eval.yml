name: GHAV ms timing

on:
  push:
    branches:
      - 'codex/ghav-ms-*'

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18
          - 20
          - 22
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true
          version: 7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}
      - name: Run tests (parallel)
        run: |-
          set +e
          bash -e -o pipefail -c 'pnpm run test:nodejs' &
          ghav_pid_1=$!
          bash -e -o pipefail -c 'pnpm run test:edge' &
          ghav_pid_2=$!
          ghav_status=0
          wait "$ghav_pid_1" || ghav_status=1
          wait "$ghav_pid_2" || ghav_status=1
          exit "$ghav_status"
        shell: bash
